<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEC Freshers | Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #F7F4EA;
      color: #31594D;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      border: 1px solid #d8dfd2;
      border-radius: 20px;
      background: #fffdf7;
      box-shadow: 0 12px 36px #31594D12;
    }

    h1 {
      margin-top: 0;
      font-size: 27px;
    }

    p {
      line-height: 1.6;
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      border: 1px solid #bdcbbd;
      background: white;
    }

    button {
      border: none;
      background: #31594D;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      overflow-wrap: anywhere;
      margin-top: 18px;
      font-size: 14px;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #31594D;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>JEC Admin Portal</h1>
    <p>Sign in with an authorized administrator account.</p>

    <form id="loginForm">
      <input
        id="email"
        type="email"
        placeholder="Email address"
        autocomplete="username"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">Sign In</button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <a class="back" href="./index.html">← Back to the public portal</a>
  </main>

  <script type="module">
    import { firebaseConfig } from "./firebase-config.js";

    import {
      initializeApp,
      getApp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    console.log("Firebase project:", app.options.projectId);

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    let checking = false;

    async function verifyAdmin(user) {
      if (!user || checking) return;

      checking = true;
      form.hidden = true;
      message.textContent = "Checking administrator access...";

      try {
      
        const adminRef = doc(db, "admins", user.uid);
const adminSnap = await getDoc(adminRef);

console.log("Project:", app.options.projectId);
console.log("Database:", db.app.options.projectId);
console.log("Signed-in UID:", user.uid);
console.log("Admin path:", adminRef.path);
console.log("Document exists:", adminSnap.exists());
        if (!adminSnap.exists()) {
  await signOut(auth);
  message.textContent =
    "Admin document not found. UID: " + user.uid;
  form.hidden = false;
  return;
}

const adminData = adminSnap.data();

if (adminData.active !== true) {
  await signOut(auth);
  message.textContent =
    "Admin inactive. Value: " + String(adminData.active);
  form.hidden = false;
  return;
}

if (!["owner", "admin"].includes(adminData.role)) {
  await signOut(auth);
  message.textContent =
    "Role not accepted. Value: " + JSON.stringify(adminData.role);
  form.hidden = false;
  return;
}

        message.textContent =
          "Administrator verified. Dashboard features will be added next.";
      } catch (error) {
        message.textContent =
          "Could not verify administrator access: " + error.code;
        form.hidden = false;
      } finally {
        checking = false;
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = "Signing in...";

      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const result = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        await verifyAdmin(result.user);
      } catch (error) {
        message.textContent = "Sign-in failed: " + error.code;
      } finally {
        button.disabled = false;
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) verifyAdmin(user);
    });
  </script>
</body>
</html>
