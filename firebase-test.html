<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JEC Firebase Diagnostic</title>
</head>
<body>
  <h2>JEC Firebase Diagnostic</h2>
  <p id="status">Loading...</p>

  <form id="login-form">
    <input id="email" type="email" placeholder="Email" required>
    <input id="password" type="password" placeholder="Password" required>
    <button type="submit">Sign in and diagnose</button>
  </form>

  <script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

  import {
    getFirestore,
    doc,
    getDocFromServer
  } from
    "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

  import {
    getAuth,
    signInWithEmailAndPassword
  } from
    "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

  import { firebaseConfig } from "./firebase-config.js";

  const status = document.getElementById("status");

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  document.getElementById("login-form").addEventListener(
    "submit", async (event) => {

      event.preventDefault();
      status.textContent = "Signing in...";

      try {
        const credential = await signInWithEmailAndPassword(
          auth,
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );

        const uid = credential.user.uid;

        status.textContent = "Checking Firestore server...";

        const adminRef = doc(db, "admins", uid);

        const adminSnap = await getDocFromServer(adminRef);

        const result = {
          projectId: app.options.projectId,
          uid: uid,
          documentPath: adminRef.path,
          exists: adminSnap.exists(),
          data: adminSnap.exists()
            ? adminSnap.data()
            : null
        };

        status.textContent = JSON.stringify(result);

      } catch (error) {

        status.textContent =
          "ERROR: " + error.code + " | " + error.message;

      }
    }
  );
  </script>
</body>
</html>
