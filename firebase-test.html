<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JEC Firebase Diagnostic</title>
</head>
<body>
  <h2>JEC Firebase Diagnostic</h2>
  <p id="status">Loading...</p>

  <form id="login-form">
    <input id="email" type="email" placeholder="Email" required>
    <input id="password" type="password" placeholder="Password" required>
    <button type="submit">Sign in and diagnose</button>
  </form>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import { getFirestore, getDoc, doc } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    import { getAuth, signInWithEmailAndPassword } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    import { firebaseConfig } from "./firebase-config.js";

    const status = document.getElementById("status");
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    status.textContent = "Firebase initialized.";

    document.getElementById("login-form").addEventListener(
      "submit", async (event) => {
        event.preventDefault();
        status.textContent = "Signing in...";

        try {
          const credential = await signInWithEmailAndPassword(
            auth,
            document.getElementById("email").value.trim(),
            document.getElementById("password").value
          );

          status.textContent =
            "Sign-in successful. UID: " + credential.user.uid;

          try {
            await getDoc(doc(db, "admins", credential.user.uid));
            status.textContent =
              "ADMIN READ SUCCESS. Testing content...";

          } catch (error) {
            status.textContent =
              "ADMIN READ FAILED: " + error.code;
            return;
          }

          try {
            const snapshot = await getDoc(doc(db, "content", "content"));

            status.textContent = snapshot.exists()
              ? "SUCCESS: Admin and content reads both work."
              : "Admin read worked, but content document is missing.";

          } catch (error) {
            status.textContent =
              "CONTENT READ FAILED: " + error.code;
          }

        } catch (error) {
          status.textContent = "SIGN-IN FAILED: " + error.code;
        }
      }
    );
  </script>
</body>
</html>
